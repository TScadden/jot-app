# Trigger new deployment
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd website
        - rm -rf dist
        - npm ci
    build:
      commands:
        - npm run build
        - ls -R dist # Log the build output to verify file existence
  artifacts:
    baseDirectory: website/dist
    files:
      - '**/*'
  cache:
    paths:
      - website/node_modules/**/*
customHttpConfigs:
  - httpHeaders:
      - entries:
          - key: Cache-Control
            value: public, max-age=0, must-revalidate
    pattern: '**/*.html'
redirects:
  - source: '/learn-more'
    target: '/learn-more.html'
    status: '200'
  - source: '/learn-more/'
    target: '/learn-more.html'
    status: '200'
  - source: '/<*>.html'
    target: '/<*>.html'
    status: '200'
  - source: '/<*>'
    target: '/index.html'
    status: '404-200'
