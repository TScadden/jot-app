name: tmp-flutter-apk
# LAB-ONLY patch (branch lab/blackglass-theme): after the standard
# analyze + test gate, also build the Lab (playground) flavor
# release APK split per ABI and upload ONLY the arm64 artifact.
# This change lives on the lab branch only; the production
# workflows are untouched.
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: cd flutter && flutter pub get
      - run: cd flutter && flutter analyze
      # LAB-ONLY patch (branch lab/morning-score-graph): the Morning
      # Score capture harness writes its PNGs to MORNING_CAPTURE_OUT;
      # uploaded as an artifact below for the delivery record.
      - run: cd flutter && flutter test
        env:
          MORNING_CAPTURE_OUT: ${{ github.workspace }}/captures
      - name: Upload Morning Score captures
        uses: actions/upload-artifact@v4
        with:
          name: morning-score-captures
          path: captures/*.png
          if-no-files-found: error
      - name: Build Lab (playground) release APK, split per ABI
        # Same command the production workflow's Lab identity line
        # uses: the lab flavor itself yields versionCode 2001 /
        # versionName 1.0.0 (verified in its badging checks).
        run: cd flutter && flutter build apk --release --flavor lab --split-per-abi
      - name: Upload arm64 Lab APK only
        uses: actions/upload-artifact@v4
        with:
          name: tabs-lab-apk-arm64
          path: flutter/build/app/outputs/flutter-apk/app-arm64-v8a-lab-release.apk
          if-no-files-found: error
