# TEMPORARY — Round 3b phone build. Delete after the APK is downloaded.
name: tmp-flutter-apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - name: Build arm64 release APK
        working-directory: flutter
        run: flutter build apk --release --split-per-abi
      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
