name: tmp-flutter-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: flutter-app }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.7' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: cd flutter && flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with: { name: arm64-apk, path: flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk }
