name: tmp-flutter-apk
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: cd flutter && flutter pub get
      - run: cd flutter && flutter build apk --release --split-per-abi --flavor lab
      - uses: actions/upload-artifact@v4
        with:
          name: tabs-lab-weekly-snapshot-fix
          path: flutter/build/app/outputs/flutter-apk/*.apk
