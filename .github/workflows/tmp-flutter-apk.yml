# TEMPORARY — Round 1 splash APK. DELETE AFTER USE. Do not merge to main.
name: tmp-flutter-apk-r1

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: pub get
        run: cd flutter && flutter pub get

      - name: analyze
        run: cd flutter && flutter analyze

      - name: build release split APK
        run: cd flutter && flutter build apk --release --split-per-abi

      - name: upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: tabs-flutter-splash-r1
          path: flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
