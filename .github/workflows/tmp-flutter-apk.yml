# TEMP workflow (founder-review fallback, Oct 17 2026): build the prod
# flavor with the PROVEN Lab recipe — `flutter build apk --release
# --split-per-abi` — and archive the arm64 split as a founder-review APK.
# The exotic single-APK recipe (--target-platform android-arm64 without
# --split-per-abi) produced an APK the founder's Pixel 9a refuses to
# install; every split-per-abi build this week installed flawlessly.
# The arm64 split badges versionCode 12092 (base 10092 + 2000 ABI
# offset) — accepted for this review copy. The shippable AAB (exact
# 10092) is built and verified by flutter-prod-aab.yml, untouched here.
# Archive-only: no Play upload step exists or is implied.

name: tmp-flutter-apk

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: com.notel.notel
  EXPECTED_LABEL: Tabs
  EXPECTED_CERT_SHA256: "3E:6A:0B:3B:0B:95:DD:4D:09:34:C0:04:CA:A9:43:6D:E4:52:62:6F:1D:3A:B8:73:A0:39:FA:06:E3:BA:AD:CE"
  BASE_VERSION_CODE: "10092"
  EXPECTED_SPLIT_VERSION_CODE: "12092"
  VERSION_NAME: "2.4"
  FLUTTER_VERSION: "3.47.7"
  SPLIT_APK_PATH: flutter/build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk

jobs:
  build-prod-split-apk:
    name: Build prod split-per-abi review APK (archive-only)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore upload keystore and signing properties
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > flutter/android/app/upload-keystore.keystore
          chmod 600 flutter/android/app/upload-keystore.keystore
          {
            printf '\n# CI-injected production signing (runner-local, never committed)\n'
            printf 'tabsUpload.storeFile=%s/flutter/android/app/upload-keystore.keystore\n' "$GITHUB_WORKSPACE"
            printf 'tabsUpload.storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'tabsUpload.keyAlias=tabs-upload\n'
            printf 'tabsUpload.keyPassword=%s\n' "$KEYSTORE_PASSWORD"
          } >> flutter/android/gradle.properties
          echo "Keystore restored and tabsUpload.* properties injected (values not printed)."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build prod APK (split-per-abi, proven recipe)
        working-directory: flutter
        run: |
          flutter build apk --release --split-per-abi --flavor prod \
            --build-number="$BASE_VERSION_CODE" \
            --build-name="$VERSION_NAME" \
            --dart-define=TABS_PRODUCTION_BILLING=true
          ls -la build/app/outputs/flutter-apk/

      - name: Widget gate on arm64 split
        working-directory: flutter
        run: bash tool/check_widget_apk.sh build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk

      - name: Verify arm64 split identity (badging + upload cert)
        run: |
          set -eu
          [ -s "$SPLIT_APK_PATH" ] || { echo "::error::split APK missing: $SPLIT_APK_PATH"; exit 1; }
          echo "Split APK: $(stat -c%s "$SPLIT_APK_PATH") bytes"
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          BADGING="$("$AAPT2" dump badging "$SPLIT_APK_PATH")"
          echo "$BADGING" | head -3
          PKG="$(printf '%s' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VC="$(printf '%s' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([^']*\)'.*/\1/p")"
          VN="$(printf '%s' "$BADGING" | sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\([^']*\)'.*/\1/p")"
          LABEL="$(printf '%s' "$BADGING" | sed -n "s/^application-label:'\(.*\)'/\1/p" | head -1)"
          NATIVE="$(printf '%s' "$BADGING" | sed -n "s/^native-code: //p")"
          echo "package=$PKG versionCode=$VC versionName=$VN label=$LABEL native=$NATIVE"
          [ "$PKG" = "$PACKAGE_NAME" ] || { echo "::error::package mismatch: $PKG"; exit 1; }
          [ "$VC" = "$EXPECTED_SPLIT_VERSION_CODE" ] || { echo "::error::versionCode mismatch: $VC (expected split offset $EXPECTED_SPLIT_VERSION_CODE)"; exit 1; }
          [ "$VN" = "$VERSION_NAME" ] || { echo "::error::versionName mismatch: $VN"; exit 1; }
          [ "$LABEL" = "$EXPECTED_LABEL" ] || { echo "::error::label mismatch: $LABEL"; exit 1; }
          CERTS="$("$APKSIGNER" verify --verbose --print-certs "$SPLIT_APK_PATH")"
          echo "$CERTS"
          DIGEST="$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d '[:space:]')"
          ACTUAL="$(printf '%s' "$DIGEST" | tr '[:lower:]' '[:upper:]' | sed 's/\(..\)/\1:/g; s/:$//')"
          echo "Signer SHA-256: $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::signer is not the Play upload cert: $ACTUAL"; exit 1; }
          {
            echo "### Prod split review APK"
            echo "- package: \`$PKG\`"
            echo "- versionCode: \`$VC\` (base $BASE_VERSION_CODE + 2000 arm64 split offset)"
            echo "- versionName: \`$VN\`"
            echo "- label: \`$LABEL\`"
            echo "- signer: Play upload cert (fingerprint match)"
            echo "- size: $(stat -c%s "$SPLIT_APK_PATH") bytes"
            echo "- sha256: $(sha256sum "$SPLIT_APK_PATH" | awk '{print $1}')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive arm64 split APK
        uses: actions/upload-artifact@v4
        with:
          name: tabs-prod-review-split-apk
          path: ${{ env.SPLIT_APK_PATH }}
          if-no-files-found: error

      - name: Remove restored keystore and injected signing properties
        if: always()
        run: |
          rm -f flutter/android/app/upload-keystore.keystore
          git checkout -- flutter/android/gradle.properties || true
