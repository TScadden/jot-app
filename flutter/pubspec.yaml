name: tabs_lab
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  # Round 24 — Google sign-in (7.x, Credential Manager-based; see
  # lib/src/data/google_sign_in_service.dart).
  google_sign_in: ^7.2.0
  # Sign in with Apple (iOS; see
  # lib/src/data/apple_sign_in_service.dart). The plugin is inert on
  # Android — the Apple button never builds there.
  sign_in_with_apple: ^8.2.0
  # Round 30 — local notification scheduling (native parity for the
  # Settings reminder toggles). Pinned to the 19.x API line.
  # flutter_timezone supplies the device's IANA zone so daily
  # schedules land on local wall-clock times; timezone is the data
  # library flutter_local_notifications builds TZDateTime from.
  flutter_local_notifications: ^19.5.0
  # Daily Score background scoring (founder amendment #2, Oct 20,
  # 2026): periodic WorkManager task running the snapshot + gated
  # scoring pipeline with the app closed. Platform-deferred
  # execution only — no exact alarms.
  workmanager: ^0.10.9
  # Health Connect bridge as a local plugin package: the generated
  # plugin registrant registers HealthConnectBridgePlugin on EVERY
  # FlutterEngine (main + WorkManager background), so the channel
  # handlers answer in the background isolate too. The handlers used
  # to live only in MainActivity, where background-engine calls failed
  # with MissingPluginException. No Dart API is consumed from it —
  # HealthConnectService keeps using the same fixed channel name.
  health_connect_bridge:
    path: plugins/health_connect_bridge
  # HealthKit bridge as a local plugin package (iOS-only counterpart
  # to health_connect_bridge): the generated plugin registrant
  # registers HealthkitBridgePlugin on iOS only, serving the SAME
  # fixed channel name from HealthKit, so HealthConnectService drives
  # both platforms. It declares no Android platform, so the Android
  # registrant and behavior are unchanged. No Dart API is consumed
  # from it.
  healthkit_bridge:
    path: plugins/healthkit_bridge
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  flutter_secure_storage: ^11.2.0
  # Round 50 — home-screen widget bridge (Android AppWidget data
  # sync; the widget itself is native RemoteViews under android/).
  # 0.9.x line: current stable compatible with the project SDK /
  # Flutter 3.47 toolchain (resolves 0.9.4; requires Flutter
  # >=3.38.1, Dart >=3.10).
  home_widget: ^0.9.0
  geolocator: ^14.1.1
  url_launcher: ^6.3.1
  # Round 66 — Progress Reports PDF: pure-Dart PDF generation (pdf)
  # and the system share sheet (printing's Printing.sharePdf), plus
  # path_provider for the saved-copy location (app documents dir;
  # native saves to Downloads via MediaStore — see the round report
  # for that divergence).
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  # Round 66 — printing's loose image constraint (>=4.1.0 <=5.0.0)
  # resolves image 4.11.0, whose PNG decoder calls an archive API
  # (ZLibDecoder.decodeLazy) that the resolved archive 3.6.1 (per
  # pubspec.lock) does not provide — the app fails to compile. Pin
  # image to the last line that compiles against archive 3.6.1.
  image: 4.3.0
  # Takeover Phase 2 — Google Play Billing for Tabs Premium
  # (lib/src/data/billing_*). in_app_purchase_android is a direct
  # dependency because the Play store implementation reads
  # GooglePlayProductDetails / queryPastPurchases from it.
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.4
  # RevenueCat — iOS subscription management (App Store parity for
  # Tabs Premium; see lib/src/data/revenuecat_service.dart).
  # purchases_flutter is RevenueCat's official Flutter SDK. It
  # declares an Android implementation too, but the app NEVER
  # configures or calls it on Android: every entry point is
  # platform-gated to iOS and Android keeps the Play billing flow
  # above, byte-for-byte. The public API key is NOT in the repo —
  # it is injected at build time via
  # --dart-define=REVENUECAT_IOS_API_KEY (empty = unconfigured =
  # iOS purchases honestly unavailable; see RevenueCatConfig).
  purchases_flutter: ^11.0.4
  sentry_flutter: ^10.2.0
  # Streak upgrade (Nov 18, 2026) — the celebration / milestone
  # share action hands the generated share-card PNG to the Android
  # system share sheet via share_plus (spec addendum: no in-app
  # destination list, no direct posting, no network call).
  share_plus: ^13.3.1
  # Home redesign — Bandit reading-loop video on Home (muted, looping).
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Test-only: mocks for url_launcher's platform interface (MF-2 tests).
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/images/ic_tabs_note.png
    - assets/images/ic_google_logo.png
    - assets/images/onboarding_avatar_man.png
    - assets/images/onboarding_avatar_woman1.png
    - assets/images/onboarding_avatar_woman2.png
    - assets/images/ic_health_connect.png
    - assets/images/bandit_avatar.png
    - assets/images/bandit_avatar_blink.png
    - assets/images/bandit_full.png
    - assets/images/bandit_full_blink.png
    - assets/images/bandit_reading_poster_v8.png
    # Bandit v9 (Nov 20, 2026) — the reading loop remade as discrete
    # drawn frames in animated WebP with real alpha (replaces the
    # v8 mp4, whose baked background and breathing warp the founder
    # rejected), plus the tap-reaction one-shot. Frame-diff audited:
    # zero pixel changes outside the eye band.
    - assets/images/bandit_reading_loop_v9.webp
    - assets/images/bandit_reading_tap_v1.webp
    # Streak upgrade — Bandit cheer art for the share card (copied
    # verbatim from the signed mock source; do not recut).
    - assets/images/bandit_cheer_cut_v3.png
    # Gems — founder-approved gem icon v1 (Nov 19, 2026), copied
    # byte-identical from the design record; do not redraw/recolor.
    - assets/images/tabs_gem_icon_v1_20261119.png
    # Body revamp (Nov 20, 2026) — anatomical figures + per-zone
    # masks generated from the founder-approved mock art
    # (~/workspace/build-body-workout/gen_body_assets.py), plus the
    # on-device workout parsing table.
    - assets/body/male_front_base.png
    - assets/body/male_back_base.png
    - assets/body/female_front_base.png
    - assets/body/female_back_base.png
    - assets/body/workout_table.json
    - assets/body/zones/
    # Round 18b — bundled research library (mirrors native
    # app/src/main/assets/research/*.json).
    - assets/research/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

