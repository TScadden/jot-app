# Play internal release — fully automated Tabs pipeline.
#
# What it does, end to end:
#   1. Checks out the repo, sets up JDK 17 + Android SDK + Gradle.
#   2. Restores the upload keystore from the UPLOAD_KEYSTORE_BASE64 secret.
#   3. Builds a SIGNED release AAB (./gradlew bundleRelease) with the
#      tabsUpload signing config from app/build.gradle.kts.
#   4. Verifies the AAB's signing certificate SHA-256 matches the upload key
#      registered in Play Console, and FAILS LOUDLY if it does not.
#   5. Always saves the AAB as a workflow artifact for inspection, and builds
#      + archives a debug APK (app-debug-<versionCode>) for founder testing.
#   6. Uploads the AAB to the Play INTERNAL track as a DRAFT — but ONLY on a
#      MANUAL workflow run (Actions -> "Play internal release" -> Run workflow)
#      AND when the PLAY_UPLOADS_LIVE repository variable is 'true' (see below).
#      Plain pushes to main only build, verify, and archive the AAB — they
#      NEVER upload anything to Play. This is deliberate (founder decision
#      2026-09-29): testing happens via debug builds; Play gets a release
#      only when a human explicitly runs the workflow.
#
# Track policy (founder rule, enforced by construction):
#   - The target track is hardcoded to `internal` below. There is no workflow
#     input, variable, or secret that can redirect an upload to production,
#     beta/alpha, or any other track. workflow_dispatch takes no inputs.
#   - Release status is hardcoded to `draft`: nothing goes to testers without
#     a human promoting the draft in Play Console.
#   - Production is NEVER touched by automation. Promoting to production is
#     always the founder's explicit manual decision in Play Console.
#
# Release pinning (founder decision 2026-09-29):
#   The founder syncs work-in-progress to main freely (Antigravity pulls
#   from main) — pushes NEVER trigger a Play upload. When he says "push this
#   to the Play Store", Tyler points a `play` branch at the exact commit he
#   tested and dispatches THIS workflow on that branch, so the AAB contains
#   precisely the tested code. Anything pushed to main afterwards is NOT
#   included. Dispatch on main only if he explicitly asks for latest.
#
# Upload-key approval gate:
#   Google must first approve the upload-key reset requested 2026-09-29.
#   Until then, keep the PLAY_UPLOADS_LIVE repository variable UNSET (or
#   anything other than 'true'): the workflow will still build, verify, and
#   archive the AAB on every push, but the Play upload step is skipped.
#   After Google approves, set PLAY_UPLOADS_LIVE=true (repo Settings ->
#   Secrets and variables -> Actions -> Variables) to arm real uploads.
#
# Branching model (2026-09-30, see CONTRIBUTING.md):
#   - main is protected: no direct pushes, every change lands via pull
#     request, and the `build-and-release` job below must be green before
#     a PR can merge. PRs trigger this workflow via pull_request so the
#     required check exists to require.
#   - playground is a long-lived experimental branch. Pushes to it build a
#     DEBUG-ONLY "Tabs Lab" APK (applicationId com.notel.notel.playground)
#     via the `build-playground` job — never a signed AAB, never a Play
#     upload. The manual Play dispatch stays main-branch-only (see the
#     ref gate on the upload step).
#
# Required repository SECRETS (see ~/workspace/tabs-signing/GITHUB_SECRETS.md):
#   UPLOAD_KEYSTORE_BASE64   base64 of tabs-upload.keystore
#   KEYSTORE_PASSWORD        keystore password (also used as key password:
#                            the upload keystore is PKCS12 and its private key
#                            is protected by the store password)
#   PLAY_SERVICE_ACCOUNT_JSON  contents of the Play service-account JSON key

name: Play internal release

on:
  push:
    branches: [main, playground]
  pull_request:
    branches: [main] # so the required "build-and-release" check runs on PRs
  workflow_dispatch: # manual run; takes no inputs, so the track cannot change

permissions:
  contents: read

concurrency:
  group: play-internal-release
  cancel-in-progress: false # uploads go out in run order; never overlap

env:
  PACKAGE_NAME: com.notel.notel
  # SHA-256 of the upload certificate registered in Play Console.
  EXPECTED_CERT_SHA256: "3E:6A:0B:3B:0B:95:DD:4D:09:34:C0:04:CA:A9:43:6D:E4:52:62:6F:1D:3A:B8:73:A0:39:FA:06:E3:BA:AD:CE"
  # Play rejects any upload whose versionCode is not higher than the previous.
  # 10000 keeps every CI build safely above any manually uploaded versionCode.
  VERSION_CODE_BASE: 10000

jobs:
  build-and-release:
    # Pushes to the playground branch are handled by the build-playground
    # job below. This job runs on main pushes, PRs targeting main, and
    # manual dispatches (manual Play dispatch stays main-only: see the
    # ref gate on the upload step).
    if: github.event_name != 'push' || github.ref_name != 'playground'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default package list includes 'tools', which no longer
          # exists in the SDK repository (sdkmanager exits 1). Install only
          # what the build needs: compileSdk/targetSdk 36.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 secret is not set. See GITHUB_SECRETS.md."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/app/upload-keystore.keystore"
          chmod 600 "$GITHUB_WORKSPACE/app/upload-keystore.keystore"
          echo "Keystore restored."

      - name: Compute version code
        # Monotonic per workflow run: 10000 + github.run_number.
        run: echo "VERSION_CODE=$(( ${{ env.VERSION_CODE_BASE }} + ${{ github.run_number }} ))" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            "-PversionCodeOverride=$VERSION_CODE" \
            "-PtabsUpload.storeFile=$GITHUB_WORKSPACE/app/upload-keystore.keystore" \
            "-PtabsUpload.storePassword=$KEYSTORE_PASSWORD" \
            "-PtabsUpload.keyPassword=$KEYSTORE_PASSWORD"
          # NOTE: keyPassword == storePassword is intentional. The upload
          # keystore is PKCS12 and its private key is protected by the store
          # password (verified 2026-09-29). Do not "fix" this to a separate
          # key password or release signing will break.

      - name: Build debug APK
        # Debug APK for founder testing (sent via chat, installed directly —
        # no Antigravity needed). Not signed with the upload key and never
        # uploaded to Play.
        run: ./gradlew assembleDebug

      - name: Verify signing certificate fingerprint
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          ACTUAL="$(keytool -printcert -jarfile "$AAB" | grep -i 'SHA256:' | awk '{print $2}')"
          echo "AAB signing certificate SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "${{ env.EXPECTED_CERT_SHA256 }}" ]; then
            echo "::error::Signing certificate MISMATCH. Expected ${{ env.EXPECTED_CERT_SHA256 }} but got $ACTUAL. The AAB was NOT signed with the registered upload key — refusing to continue."
            exit 1
          fi
          echo "Certificate verified — matches the upload key in Play Console."

      - name: Archive AAB as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-${{ env.VERSION_CODE }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Archive debug APK as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-${{ env.VERSION_CODE }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload to Play (internal track, draft)
        # Runs ONLY on a manual workflow dispatch (a human clicking
        # "Run workflow"), AND only when armed by the PLAY_UPLOADS_LIVE
        # repository variable, which the founder sets to 'true' AFTER
        # Google approves the upload-key reset. Pushes to main can never
        # trigger an upload: build + verify + archive still run, nothing
        # is sent to Play. The ref gate below makes the dispatch
        # main-branch-only: a dispatch started on any other branch builds
        # but cannot upload.
        if: github.event_name == 'workflow_dispatch' && vars.PLAY_UPLOADS_LIVE == 'true' && github.ref_name == 'main'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: draft
          releaseName: "CI build ${{ github.run_number }} (versionCode ${{ env.VERSION_CODE }})"
          mappingFile: app/build/outputs/mapping/release/mapping.txt

  # Tabs Lab playground build — debug APK only, NEVER touches Play.
  #
  # Pushes to the `playground` branch build a debug APK with the "Tabs Lab"
  # identity (applicationId com.notel.notel.playground, tinted icon, separate
  # app data) via -PtabsPlayground=true in app/build.gradle.kts. No keystore
  # restore, no signed AAB, no fingerprint check, no upload: this job cannot
  # reach the Play Console by construction (no upload step exists here, and
  # the upload step in build-and-release is gated to main-branch dispatches).
  build-playground:
    name: Build playground (Tabs Lab) debug APK
    if: github.event_name == 'push' && github.ref_name == 'playground'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Build Tabs Lab debug APK
        # -PtabsPlayground=true applies the Lab identity in
        # app/build.gradle.kts: applicationIdSuffix ".playground",
        # label "Tabs Lab", tinted launcher icon. Signed with the shared
        # debug keystore; never the upload key; never uploaded to Play.
        run: ./gradlew assembleDebug -PtabsPlayground=true

      - name: Archive Tabs Lab debug APK as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tabs-lab-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
