name: layer2-builds
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: cd flutter && flutter pub get
      - name: Build DSN-live lab APK
        run: cd flutter && flutter build apk --release --split-per-abi --flavor lab --dart-define=SENTRY_DSN=${{ secrets.SENTRY_LAB_DSN }}
      - name: Stage DSN-live arm64 APK
        run: mkdir -p /tmp/layer2 && cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-lab-release.apk /tmp/layer2/layer2_dsn_live_arm64.apk
      - name: Build DSN-empty lab APK
        run: cd flutter && flutter build apk --release --split-per-abi --flavor lab
      - name: Stage DSN-empty arm64 APK
        run: cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-lab-release.apk /tmp/layer2/layer2_dsn_empty_arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tabs-lab-layer2-builds
          path: /tmp/layer2/*.apk
