<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jot | Reset Password</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #0A0A0E;
            --surface-color: #161622;
            --surface-high: #20202E;
            --primary-color: #7C6EFF;
            --accent-color: #4ECDC4;
            --text-primary: #F0EEFF;
            --text-secondary: #918AA8;
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(124, 110, 255, 0.15), transparent 40%),
                radial-gradient(circle at bottom left, rgba(78, 205, 196, 0.1), transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-primary);
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .container {
            background-color: rgba(22, 22, 34, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(124, 110, 255, 0.1);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            text-align: center;
            font-weight: 900;
            font-size: 1.75rem;
            color: var(--primary-color);
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: var(--text-secondary);
            margin-left: 0.25rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            background-color: var(--surface-high);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #4a4559;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(124, 110, 255, 0.2);
            background-color: rgba(32, 32, 46, 0.9);
        }

        button {
            width: 100%;
            padding: 1rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #7C6EFF 0%, #6151e6 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(124, 110, 255, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(124, 110, 255, 0.4);
            background: linear-gradient(135deg, #8b7fff 0%, #6858f5 100%);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--surface-high);
            color: var(--text-secondary);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 1.25rem;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            min-height: 1.25rem;
            padding: 0 0.5rem;
        }

        .success {
            color: var(--accent-color);
        }

        .error {
            color: #ff5e62;
        }

        /* Mobile specific adjustments constraints */
        @media (max-width: 400px) {
            .container {
                padding: 2rem 1.5rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            input {
                padding: 0.875rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Reset Password</h2>
        <p>Please enter your new 8-character password below to regain access to Jot.</p>

        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" placeholder="••••••••" required minlength="8">
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="••••••••" required minlength="8">
        </div>

        <button id="submit-btn" onclick="resetPassword()">Change Password</button>

        <div id="status-message" class="message"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const API_URL = "/api/auth/reset-password";

        async function resetPassword() {
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirm-password').value;
            const statusBox = document.getElementById('status-message');
            const btn = document.getElementById('submit-btn');

            statusBox.textContent = "";
            statusBox.className = "message";

            if (!token) {
                statusBox.textContent = "Error: Invalid reset link! You are missing the secure token.";
                statusBox.className = "message error";
                return;
            }

            if (pass.length < 8) {
                statusBox.textContent = "Password must be at least 8 characters long.";
                statusBox.className = "message error";
                return;
            }

            if (pass !== confirmPass) {
                statusBox.textContent = "Passwords do not match! Please try again.";
                statusBox.className = "message error";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Encrypting...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token, newPassword: pass })
                });

                const data = await response.json();

                if (response.ok) {
                    statusBox.textContent = "Success! You can now log into the Jot app.";
                    statusBox.className = "message success";
                    btn.textContent = "Password Changed ✓";
                } else {
                    statusBox.textContent = data.error || "Reset failed. The token may be expired.";
                    statusBox.className = "message error";
                    btn.disabled = false;
                    btn.textContent = "Try Again";
                }
            } catch (e) {
                statusBox.textContent = "Error securely connecting to the server.";
                statusBox.className = "message error";
                btn.disabled = false;
                btn.textContent = "Change Password";
            }
        }
    </script>

</body>

</html>
